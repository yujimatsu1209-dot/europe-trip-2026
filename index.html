<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf4ff"><title>欧州旅行2026</title>

<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f7fb;color:#172033}button,input,textarea,select{font:inherit}main{max-width:820px;margin:auto;padding:12px 12px 90px}.card{background:#fff;border:1px solid #dde3ee;border-radius:18px;padding:15px;margin-bottom:11px}.hero{background:linear-gradient(135deg,#fff,#eef5ff)}h1{font-size:24px;margin:3px 0 5px}.muted{color:#687386;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.stat{background:#f7f9fc;border-radius:12px;padding:9px;text-align:center}.stat b{font-size:18px}.tabs{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#f5f7fb;padding:7px 0}.tabs button,.btn,.smallbtn{border:1px solid #d9e0eb;background:#fff;border-radius:11px;min-height:42px}.tabs button{font-size:12px;padding:4px}.tabs .active,.primary{background:#dceaff;border-color:#8cb7f5;color:#103f78}.panel{display:none}.panel.active{display:block}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.form{display:none;border-top:1px solid #e7ebf1;margin-top:12px;padding-top:8px}.form.open{display:block}label{display:block;font-size:12px;color:#657084;margin:9px 0 4px}input,textarea,select{width:100%;border:1px solid #ccd5e2;border-radius:11px;padding:10px;background:#fff;font-size:16px}textarea{resize:vertical}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{padding:0 13px}.smallbtn{min-height:34px;padding:0 9px;font-size:12px}.danger{color:#a82424}.event{display:flex;gap:10px}.date{min-width:54px;font-weight:700;text-align:center}.detail{border-left:2px solid #dce4ef;padding-left:11px;flex:1;min-width:0}.detail h3{font-size:16px;margin:0 0 4px}.tag{display:inline-block;background:#f0f3f8;border-radius:999px;padding:3px 8px;font-size:11px;margin:2px 3px 2px 0}.link{color:#1558a6;text-decoration:none}.today{border-color:#8cb7f5;background:#f6faff}.booking{border-bottom:1px solid #e9edf3;padding:11px 0}.booking:last-child{border:0}.check{display:flex;align-items:center;gap:8px;border-bottom:1px solid #edf0f4;min-height:46px}.check input{width:20px;height:20px}.progress{height:9px;background:#e9edf3;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#6599df}.search{margin:0 0 10px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.quick button{border:1px solid #dde3ee;background:#fff;border-radius:13px;min-height:58px;font-size:12px}.notice{background:#fff8e6;border:1px solid #efd58b;border-radius:13px;padding:11px;margin-bottom:10px;font-size:13px}.money{font-variant-numeric:tabular-nums}.empty{color:#7b8493;padding:10px 0}.fab{position:fixed;right:18px;bottom:20px;width:56px;height:56px;border:0;border-radius:50%;background:#2769b8;color:#fff;font-size:28px;box-shadow:0 5px 18px #0003}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:10;padding:18px;overflow:auto}.modal.open{display:block}.modalbox{max-width:600px;margin:6vh auto;background:#fff;border-radius:18px;padding:16px}.backup{white-space:pre-wrap;word-break:break-all;font-size:11px;max-height:160px;overflow:auto;background:#f5f7fb;padding:8px;border-radius:8px}.sectionTitle{margin:0;font-size:19px}.right{text-align:right}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.tabs button{font-size:11px}.quick{grid-template-columns:repeat(2,1fr)}main{padding:9px 9px 90px}.card{padding:13px}}
</style></head><body><main>
<section class="card hero"><div class="muted">MY EUROPE TRIP · 2026</div><h1>🇪🇺 欧州旅行</h1><div class="muted">端末内に保存する、自分専用の旅行管理アプリ</div><div id="nextBox" class="notice" style="margin-top:12px"></div><div class="stats"><div class="stat"><b id="sTrip">0</b><div class="muted">旅程</div></div><div class="stat"><b id="sBook">0</b><div class="muted">予約</div></div><div class="stat"><b id="sCheck">0</b><div class="muted">準備完了</div></div><div class="stat"><b id="sCost" class="money">€0</b><div class="muted">登録費用</div></div></div></section>
<div class="quick"><button data-go="trip">🗓️<br>今日・旅程</button><button data-go="booking">🎫<br>予約・チケット</button><button data-go="check">🧳<br>持ち物</button><button data-go="tools">🛠️<br>旅行ツール</button></div>
<div class="tabs"><button class="active" data-tab="trip">旅程</button><button data-tab="booking">予約</button><button data-tab="check">準備</button><button data-tab="memo">メモ</button><button data-tab="tools">ツール</button></div>
<section id="trip" class="panel active"><div class="card"><div class="row between"><h2 class="sectionTitle">旅程</h2><button class="btn primary" onclick="openTrip()">＋追加</button></div><input id="tripSearch" class="search" placeholder="🔎 都市・予定を検索"><form id="tripForm" class="form"><input type="hidden" id="tId"><div class="grid2"><div><label>日付</label><input id="tDate" type="date" required></div><div><label>時刻</label><input id="tTime" type="time"></div></div><div class="grid2"><div><label>種類</label><select id="tType"><option>🚆 移動</option><option>✈️ 飛行機</option><option>🏨 宿泊</option><option>🎨 観光</option><option>🍽 食事</option><option>🏇 イベント</option><option>📌 その他</option></select></div><div><label>都市・場所</label><input id="tPlace" placeholder="Paris"></div></div><label>タイトル</label><input id="tTitle" required maxlength="100"><label>詳細</label><textarea id="tDetail" rows="3"></textarea><label>住所 / Google Maps検索語</label><input id="tMap" placeholder="Louvre Museum Paris"><label>関連URL</label><input id="tUrl" type="url" placeholder="https://..."><div class="actions"><button class="btn primary">保存</button><button type="button" class="btn" onclick="closeForm('tripForm')">キャンセル</button></div></form></div><div id="tripList"></div></section>
<section id="booking" class="panel"><div class="card"><div class="row between"><h2 class="sectionTitle">予約・チケット</h2><button class="btn primary" onclick="openBook()">＋追加</button></div><input id="bookSearch" class="search" placeholder="🔎 予約を検索"><form id="bookForm" class="form"><input type="hidden" id="bId"><div class="grid2"><div><label>日付</label><input id="bDate" type="date"></div><div><label>種類</label><select id="bType"><option>🚆 鉄道</option><option>✈️ 飛行機</option><option>🏨 ホテル</option><option>🎫 入場券</option><option>🍽 レストラン</option><option>📌 その他</option></select></div></div><label>予約名</label><input id="bTitle" required><div class="grid2"><div><label>予約番号</label><input id="bCode"></div><div><label>座席 / 部屋</label><input id="bSeat"></div></div><div class="grid2"><div><label>金額</label><input id="bCost" type="number" step="0.01" min="0"></div><div><label>通貨</label><select id="bCur"><option>EUR</option><option>JPY</option><option>CZK</option><option>GBP</option><option>USD</option></select></div></div><label>詳細</label><textarea id="bDetail" rows="3"></textarea><label>予約ページ / チケットURL</label><input id="bUrl" type="url"><label>住所 / Maps検索語</label><input id="bMap"><div class="actions"><button class="btn primary">保存</button><button type="button" class="btn" onclick="closeForm('bookForm')">キャンセル</button></div></form></div><div class="card" id="bookList"></div></section>
<section id="check" class="panel"><div class="card"><div class="row between"><h2 class="sectionTitle">持ち物・やること</h2><button class="btn primary" onclick="openCheck()">＋追加</button></div><div class="progress"><div id="checkBar"></div></div><div id="checkPct" class="muted right" style="margin-top:5px"></div><form id="checkForm" class="form"><input type="hidden" id="cId"><div class="grid2"><div><label>カテゴリ</label><select id="cCat"><option>必携</option><option>衣類</option><option>電子機器</option><option>薬・衛生</option><option>予約確認</option><option>その他</option></select></div><div><label>期限</label><input id="cDue" type="date"></div></div><label>項目</label><input id="cTitle" required><div class="actions"><button class="btn primary">保存</button><button type="button" class="btn" onclick="closeForm('checkForm')">キャンセル</button></div></form><div id="checks"></div></div></section>
<section id="memo" class="panel"><div class="card"><div class="row between"><h2 class="sectionTitle">メモ</h2><button class="btn primary" onclick="openMemo()">＋追加</button></div><form id="memoForm" class="form"><input type="hidden" id="mId"><label>カテゴリ</label><select id="mCat"><option>行きたい場所</option><option>食べたい物</option><option>注意事項</option><option>買い物</option><option>自由メモ</option></select><label>タイトル</label><input id="mTitle" required><label>内容</label><textarea id="mBody" rows="5" required></textarea><label>URL</label><input id="mUrl" type="url"><div class="actions"><button class="btn primary">保存</button><button type="button" class="btn" onclick="closeForm('memoForm')">キャンセル</button></div></form><div id="memoList"></div></div></section>
<section id="tools" class="panel"><div class="card"><h2 class="sectionTitle">旅行ツール</h2><div class="quick" style="margin-top:12px"><button onclick="window.open('https://www.google.com/maps','_blank')">🗺️<br>Google Maps</button><button onclick="window.open('https://translate.google.com','_blank')">🈯<br>翻訳</button><button onclick="window.open('https://www.google.com/search?q=EUR+JPY','_blank')">💱<br>EUR/JPY</button><button onclick="window.open('https://www.google.com/search?q=weather+Europe','_blank')">🌦️<br>天気検索</button></div></div><div class="card"><h2 class="sectionTitle">緊急・重要情報</h2><div class="muted" style="margin:8px 0">ここに保険会社・カード紛失窓口・親戚の連絡先などを自分で登録できます。パスワードやカード番号そのものは保存しないでください。</div><textarea id="emergency" rows="6" placeholder="例：海外旅行保険 連絡先…"></textarea><button class="btn primary" style="margin-top:8px" onclick="saveEmergency()">保存</button></div><div class="card"><h2 class="sectionTitle">データ管理</h2><p class="muted">このアプリのデータをJSONでバックアップできます。機種変更やファイル更新前にコピー推奨。</p><div class="actions"><button class="btn" onclick="showBackup()">バックアップ表示</button><button class="btn" onclick="document.getElementById('restoreBox').classList.toggle('open')">復元</button><button class="btn danger" onclick="resetAll()">全データ初期化</button></div><div id="backupOut" class="backup" style="display:none"></div><div id="restoreBox" class="form"><label>バックアップJSONを貼り付け</label><textarea id="restoreText" rows="6"></textarea><button class="btn primary" onclick="restoreAll()">復元実行</button></div></div><div class="card"><h2 class="sectionTitle">費用サマリー</h2><div id="costSummary"></div></div></section>
</main><button class="fab" aria-label="追加" onclick="quickAdd()">＋</button>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='euro26PrivateV1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}):'日付未設定';
const defaults={trips:[],books:[],checks:[],memos:[],emergency:''};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaults}catch{db=defaults}function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function go(id){$$('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));$$('.panel').forEach(x=>x.classList.toggle('active',x.id===id));scrollTo({top:0,behavior:'smooth'})}$$('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));function closeForm(id){$('#'+id).classList.remove('open');$('#'+id).reset?.()}function openTrip(id){const f=$('#tripForm');f.reset();$('#tId').value='';if(id){let x=db.trips.find(x=>x.id===id);for(const [k,v] of Object.entries({tId:x.id,tDate:x.date,tTime:x.time,tType:x.type,tPlace:x.place,tTitle:x.title,tDetail:x.detail,tMap:x.map,tUrl:x.url}))$('#'+k).value=v||''}f.classList.add('open');f.scrollIntoView({behavior:'smooth'})}function openBook(id){let f=$('#bookForm');f.reset();$('#bId').value='';if(id){let x=db.books.find(x=>x.id===id);for(const [k,v] of Object.entries({bId:x.id,bDate:x.date,bType:x.type,bTitle:x.title,bCode:x.code,bSeat:x.seat,bCost:x.cost,bCur:x.cur,bDetail:x.detail,bUrl:x.url,bMap:x.map}))$('#'+k).value=v??''}f.classList.add('open');f.scrollIntoView({behavior:'smooth'})}function openCheck(id){let f=$('#checkForm');f.reset();$('#cId').value='';if(id){let x=db.checks.find(x=>x.id===id);$('#cId').value=x.id;$('#cCat').value=x.cat;$('#cDue').value=x.due;$('#cTitle').value=x.title}f.classList.add('open')}function openMemo(id){let f=$('#memoForm');f.reset();$('#mId').value='';if(id){let x=db.memos.find(x=>x.id===id);$('#mId').value=x.id;$('#mCat').value=x.cat;$('#mTitle').value=x.title;$('#mBody').value=x.body;$('#mUrl').value=x.url||''}f.classList.add('open')}
$('#tripForm').onsubmit=e=>{e.preventDefault();let id=$('#tId').value||uid(),x={id,date:$('#tDate').value,time:$('#tTime').value,type:$('#tType').value,place:$('#tPlace').value.trim(),title:$('#tTitle').value.trim(),detail:$('#tDetail').value.trim(),map:$('#tMap').value.trim(),url:$('#tUrl').value.trim()};let i=db.trips.findIndex(x=>x.id===id);i<0?db.trips.push(x):db.trips[i]=x;closeForm('tripForm');save()};$('#bookForm').onsubmit=e=>{e.preventDefault();let id=$('#bId').value||uid(),x={id,date:$('#bDate').value,type:$('#bType').value,title:$('#bTitle').value.trim(),code:$('#bCode').value.trim(),seat:$('#bSeat').value.trim(),cost:Number($('#bCost').value)||0,cur:$('#bCur').value,detail:$('#bDetail').value.trim(),url:$('#bUrl').value.trim(),map:$('#bMap').value.trim()};let i=db.books.findIndex(x=>x.id===id);i<0?db.books.push(x):db.books[i]=x;closeForm('bookForm');save()};$('#checkForm').onsubmit=e=>{e.preventDefault();let id=$('#cId').value||uid(),old=db.checks.find(x=>x.id===id),x={id,cat:$('#cCat').value,title:$('#cTitle').value.trim(),due:$('#cDue').value,done:old?.done||false};let i=db.checks.findIndex(x=>x.id===id);i<0?db.checks.push(x):db.checks[i]=x;closeForm('checkForm');save()};$('#memoForm').onsubmit=e=>{e.preventDefault();let id=$('#mId').value||uid(),x={id,cat:$('#mCat').value,title:$('#mTitle').value.trim(),body:$('#mBody').value.trim(),url:$('#mUrl').value.trim(),updated:new Date().toLocaleString('ja-JP')};let i=db.memos.findIndex(x=>x.id===id);i<0?db.memos.unshift(x):db.memos[i]=x;closeForm('memoForm');save()};
function maps(q){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank')}function del(kind,id){if(confirm('削除しますか？')){db[kind]=db[kind].filter(x=>x.id!==id);save()}}function toggle(id,v){db.checks.find(x=>x.id===id).done=v;save()}function quickAdd(){let active=$('.panel.active').id;if(active==='booking')openBook();else if(active==='check')openCheck();else if(active==='memo')openMemo();else{go('trip');openTrip()}}
function renderTrips(){let q=$('#tripSearch').value.toLowerCase(),arr=[...db.trips].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#tripList').innerHTML=arr.map(x=>`<article class="card event"><div class="date">${fmt(x.date)}<div class="muted">${esc(x.time)}</div></div><div class="detail"><h3>${esc(x.type)} ${esc(x.title)}</h3>${x.place?`<span class="tag">📍 ${esc(x.place)}</span>`:''}<div style="white-space:pre-wrap">${esc(x.detail)}</div><div class="actions">${x.map?`<button class="smallbtn" onclick="maps('${esc(x.map).replace(/'/g,'&#39;')}')">地図</button>`:''}${x.url?`<button class="smallbtn" onclick="window.open('${esc(x.url)}','_blank')">URL</button>`:''}<button class="smallbtn" onclick="openTrip('${x.id}')">修正</button><button class="smallbtn danger" onclick="del('trips','${x.id}')">削除</button></div></div></article>`).join('')||'<div class="card empty">該当する旅程はありません。</div>'}
function renderBooks(){let q=$('#bookSearch').value.toLowerCase(),arr=[...db.books].sort((a,b)=>a.date.localeCompare(b.date)).filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#bookList').innerHTML=arr.map(x=>`<div class="booking"><div class="row between"><b>${esc(x.type)} ${esc(x.title)}</b><span class="muted">${fmt(x.date)}</span></div>${x.code?`<span class="tag">予約 ${esc(x.code)}</span>`:''}${x.seat?`<span class="tag">${esc(x.seat)}</span>`:''}${x.cost?`<span class="tag money">${esc(x.cur)} ${x.cost.toLocaleString()}</span>`:''}<div style="white-space:pre-wrap">${esc(x.detail)}</div><div class="actions">${x.map?`<button class="smallbtn" onclick="maps('${esc(x.map).replace(/'/g,'&#39;')}')">地図</button>`:''}${x.url?`<button class="smallbtn" onclick="window.open('${esc(x.url)}','_blank')">予約ページ</button>`:''}<button class="smallbtn" onclick="openBook('${x.id}')">修正</button><button class="smallbtn danger" onclick="del('books','${x.id}')">削除</button></div></div>`).join('')||'<div class="empty">予約はありません。</div>'}
function renderChecks(){let done=db.checks.filter(x=>x.done).length,p=db.checks.length?Math.round(done/db.checks.length*100):0;$('#checkBar').style.width=p+'%';$('#checkPct').textContent=`${done}/${db.checks.length} 完了（${p}%）`;$('#checks').innerHTML=[...db.checks].sort((a,b)=>Number(a.done)-Number(b.done)).map(x=>`<div class="check"><input type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}',this.checked)"><div style="flex:1;${x.done?'text-decoration:line-through;color:#7b8493':''}"><span class="tag">${esc(x.cat)}</span>${esc(x.title)}${x.due?`<div class="muted">期限 ${fmt(x.due)}</div>`:''}</div><button class="smallbtn" onclick="openCheck('${x.id}')">修正</button><button class="smallbtn danger" onclick="del('checks','${x.id}')">×</button></div>`).join('')}
function renderMemos(){$('#memoList').innerHTML=db.memos.map(x=>`<div class="booking"><span class="tag">${esc(x.cat)}</span><b>${esc(x.title)}</b><div style="white-space:pre-wrap;margin-top:6px">${esc(x.body)}</div><div class="muted">${esc(x.updated||'')}</div><div class="actions">${x.url?`<button class="smallbtn" onclick="window.open('${esc(x.url)}','_blank')">URL</button>`:''}<button class="smallbtn" onclick="openMemo('${x.id}')">修正</button><button class="smallbtn danger" onclick="del('memos','${x.id}')">削除</button></div></div>`).join('')||'<div class="empty">メモはありません。</div>'}
function renderStats(){$('#sTrip').textContent=db.trips.length;$('#sBook').textContent=db.books.length;$('#sCheck').textContent=db.checks.filter(x=>x.done).length+'/'+db.checks.length;let eur=db.books.filter(x=>x.cur==='EUR').reduce((s,x)=>s+x.cost,0);$('#sCost').textContent='€'+eur.toLocaleString(undefined,{maximumFractionDigits:2});let today=new Date().toISOString().slice(0,10),next=[...db.trips].filter(x=>x.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];$('#nextBox').innerHTML=next?`<b>次の予定：</b> ${fmt(next.date)} ${esc(next.time)}　${esc(next.title)}`:'<b>旅程を登録すると、次の予定をここに表示します。</b>';let sums={};db.books.forEach(x=>{if(x.cost)sums[x.cur]=(sums[x.cur]||0)+x.cost});$('#costSummary').innerHTML=Object.entries(sums).map(([c,v])=>`<div class="row between booking"><span>${c}</span><b class="money">${v.toLocaleString(undefined,{maximumFractionDigits:2})}</b></div>`).join('')||'<div class="empty">金額データなし</div>'}
function renderAll(){renderTrips();renderBooks();renderChecks();renderMemos();renderStats();$('#emergency').value=db.emergency||''}$('#tripSearch').oninput=renderTrips;$('#bookSearch').oninput=renderBooks;function saveEmergency(){db.emergency=$('#emergency').value;save();alert('保存しました')}function showBackup(){let o=$('#backupOut');o.style.display='block';o.textContent=JSON.stringify(db)}function restoreAll(){try{let x=JSON.parse($('#restoreText').value);if(!x.trips||!x.books||!x.checks)throw 0;db=x;save();alert('復元しました')}catch{alert('バックアップデータを確認してください')}}function resetAll(){if(confirm('すべての登録データを初期状態に戻しますか？')){localStorage.removeItem(KEY);location.reload()}}renderAll();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
}
</script>
</body></html>
